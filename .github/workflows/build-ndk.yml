name: Build NDK package

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "NDK version number (e.g. 30)"
        required: true
        default: "30"
      revision:
        description: "Revision letter (empty for final)"
        required: false
        default: ""
      pkg_version:
        description: "SDK package version (Pkg.Revision, e.g. 30.0.0)"
        required: true
        default: "30.0.0"
      llvm_repo_owner:
        description: "llvm-custom release owner"
        required: false
        default: HomuHomu833

permissions:
  contents: write
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            host: linux-arm64
          - target: armv7a-linux-androideabi
            host: linux-arm
    runs-on: ubuntu-24.04
    steps:
      - uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 5120
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          sudo rsync -aqP /var/lib/docker/ /mnt/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build NDK
        working-directory: builder/android-ndk-custom
        run: |
          IMAGE="ghcr.io/apex-studio-dev/ndk-builder:latest"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/builder/android-ndk-custom --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            -e PLATFORM=bionic \
            -e TARGET=${{ matrix.target }} \
            -e NDK_VERSION='${{ inputs.ndk_version }}' \
            -e NDK_REVISION='${{ inputs.revision }}' \
            -e ROOTDIR=/work/builder/android-ndk-custom \
            -e REPO_OWNER='${{ inputs.llvm_repo_owner }}' \
            "$IMAGE" \
            bash -c 'scripts/make-ndk.sh'
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          rev="${{ inputs.revision }}"
          scripts/make-package.sh ndk '${{ inputs.pkg_version }}' '${{ matrix.host }}' \
            "builder/android-ndk-custom/android-ndk-r${{ inputs.ndk_version }}${rev}-${{ matrix.target }}.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: ndk-${{ matrix.host }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: apex-ndk-${{ inputs.pkg_version }}
          name: apex-ndk-${{ inputs.pkg_version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "dist/ndk-${{ inputs.pkg_version }}-*"
