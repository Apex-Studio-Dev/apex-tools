name: Make CMake

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CMake version"
        required: true
        default: "4.1.2"
      source_repo:
        description: "Upstream repo providing cmake-<target>.tar.xz"
        required: true
        default: "HomuHomu833/cmake-custom"
      source_tag:
        description: "Upstream release tag (empty = latest)"
        required: false
        default: ""
      hosts:
        description: "JSON array of hosttags"
        required: true
        default: '["linux-arm64","linux-arm"]'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      urls: ${{ steps.r.outputs.urls }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='${{ inputs.source_repo }}'
          if [ -z '${{ inputs.source_tag }}' ]; then
            tag=$(gh api "repos/$repo/releases/latest" -q .tag_name)
          else
            tag='${{ inputs.source_tag }}'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          urls=$(echo '${{ inputs.hosts }}' | jq -r --arg repo "$repo" --arg tag "$tag" '
            [ .[] | ({"linux-arm64":"cmake-aarch64-linux-musl.tar.xz",
                     "linux-arm":"cmake-armv7a-linux-musleabihf.tar.xz",
                     "linux-x64":"cmake-x86_64-linux-musl.tar.xz"}[.])
                  | "https://github.com/\($repo)/releases/download/\($tag)/\(.)" ] | tojson')
          echo "urls=$urls" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    uses: ./.github/workflows/make-components.yml
    with:
      component: cmake
      versions: '["${{ inputs.version }}"]'
      hosts: ${{ inputs.hosts }}
      assets: ${{ needs.resolve.outputs.urls }}
