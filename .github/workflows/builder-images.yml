name: Builder Images

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "builder/*/docker/Dockerfile"
      - ".github/workflows/builder-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-sdk-custom
            image: sdk-builder
          - name: android-ndk-custom
            image: ndk-builder
          - name: cmake-custom
            image: cmake-builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: builder/${{ matrix.name }}/docker
          push: true
          tags: ghcr.io/apex-studio-dev/${{ matrix.image }}:latest
          build-args: REPO_OWNER=${{ github.repository_owner }}
