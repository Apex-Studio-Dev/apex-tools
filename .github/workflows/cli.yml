name: CLI build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["cmd/**", "scripts/build-cli.sh", ".github/workflows/cli.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./... && go test ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [arm64, arm, amd64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: scripts/build-cli.sh
        env:
          APEX_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: apex-linux-${{ matrix.arch }}
          path: dist/apex-linux-${{ matrix.arch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: cli-${{ github.ref_name }}
          artifacts: "dist/apex-*"
